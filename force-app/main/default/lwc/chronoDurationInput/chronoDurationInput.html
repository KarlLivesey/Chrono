<template
  ><fieldset>
    <legend class="slds-form-element__label">{label}</legend>
    <div class="units">
      <template for:each={fields} for:item="field"
        ><lightning-input
          key={field.name}
          data-field={field.name}
          label={field.label}
          type="number"
          min="0"
          step={field.step}
          value={field.value}
          disabled={disabled}
          onchange={change}
        ></lightning-input
      ></template>
    </div>
    <div class="options">
      <lightning-input
        data-field="negative"
        type="checkbox"
        label="Negative duration"
        checked={parts.negative}
        disabled={disabled}
        onchange={change}
      ></lightning-input
      ><lightning-button
        variant="base"
        label="Clear"
        disabled={disabled}
        onclick={clear}
      ></lightning-button>
    </div>
    <template lwc:if={error}
      ><div class="slds-text-color_error" role="alert">{error}</div></template
    >
  </fieldset></template
>
